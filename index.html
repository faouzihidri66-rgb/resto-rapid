<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#F5F9FF;color:#222;padding-bottom:120px}
.top-bar{background:linear-gradient(90deg,#0D47A1,#1976D2);color:#fff;padding:10px;text-align:center;font-weight:800;font-size:13px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.offer{background:#111;color:#fff;padding:14px 16px;text-align:center;font-weight:900;font-size:14px;border-bottom:3px solid #1976D2;position:sticky;top:0;z-index:200;display:flex;justify-content:center;align-items:center;gap:10px}
.offer b{background:#1976D2;color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.header{background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:99}
.logo{font-size:22px;font-weight:900;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo span{background:#1976D2;color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.live{font-size:11px;background:#E3F2FD;color:#0D47A1;padding:6px 12px;border-radius:20px;border:1px solid #BBDEFB;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#00C853;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.contact-bar{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #BBDEFB;overflow:auto}
.cbtn{flex:1;min-width:70px;padding:10px 8px;border-radius:12px;border:none;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;white-space:nowrap;cursor:pointer}
.cbtn.call{background:#E8F5E9;color:#2E7D32;border:1.5px solid #A5D6A7}
.cbtn.fb{background:#E3F2FD;color:#1565C0;border:1.5px solid #90CAF9}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#fff;position:sticky;top:68px;z-index:90}
.chip{white-space:nowrap;padding:10px 18px;border-radius:25px;background:#E3F2FD;border:2px solid #BBDEFB;font-weight:700;cursor:pointer;flex-shrink:0}
.chip.active{background:#0D47A1;color:#fff;border-color:#0D47A1}
.menu{max-width:900px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:20px;padding:12px;display:flex;gap:14px;margin-bottom:14px;box-shadow:0 4px 20px rgba(13,71,161,.08);border:1.5px solid #BBDEFB;position:relative}
.card img{width:90px;height:90px;border-radius:16px;object-fit:cover;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.info{flex:1}
.info h3{font-size:16px;font-weight:900;margin-bottom:4px}
.info p{font-size:12px;color:#666}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:900;font-size:18px;color:#00C853}
.add{background:#111;color:#fff;border:2px solid #1976D2;padding:8px 18px;border-radius:22px;font-weight:900;cursor:pointer}
.loyalty{max-width:900px;margin:12px auto;background:#111;color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;border:2px solid #1976D2}
.loyalty b{color:#64B5F6}
.loyalty-bar{width:100%;height:8px;background:rgba(255,255,255,.2);border-radius:10px;margin-top:8px;overflow:hidden}
.loyalty-fill{height:100%;background:linear-gradient(90deg,#1976D2,#64B5F6);border-radius:10px}
.cart-btn{position:fixed;bottom:20px;right:20px;z-index:99;background:linear-gradient(135deg,#0D47A1,#1976D2);color:#fff;border:none;width:68px;height:68px;border-radius:20px;font-size:28px;box-shadow:0 8px 24px rgba(13,71,161,.4);display:flex;align-items:center;justify-content:center}
.cart-num{position:absolute;top:-6px;right:-6px;background:#FF1744;color:#fff;min-width:26px;height:26px;border-radius:13px;font-size:12px;display:grid;place-items:center;border:2px solid #fff;font-weight:900}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:101;display:none}
.drawer{position:fixed;bottom:0;left:0;right:0;max-width:700px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;z-index:102;transform:translateY(110%);transition:.35s;max-height:94vh;overflow:auto;padding:16px}
.drawer.open{transform:translateY(0)}
.list{background:#F5F9FF;border:1px solid #BBDEFB;border-radius:14px;padding:12px;margin:12px 0;max-height:28vh;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #BBDEFB}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:2px solid #BBDEFB;background:#F5F9FF;outline:none;margin-bottom:8px;font-size:14px}
.gps{background:#1976D2;color:#fff;border:none;padding:12px;border-radius:12px;flex:1;font-weight:800;cursor:pointer}
.clear{background:#fff;border:2px solid #BBDEFB;padding:12px;border-radius:12px;flex:1;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;padding:14px;border-radius:14px;margin-top:10px;font-weight:900}
.total b{color:#64B5F6;font-size:20px}
.send{width:100%;margin-top:12px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer}

function render(){
 let html=''; menu.forEach(m=>{
  html+=`<div class="card" data-cat="${m.cat}"><img src="${m.img}"><div class="info"><h3>${m.name}</h3><p>${m.desc}</p><div class="bottom"><span class="price">${m.price.toFixed(1)} دت</span><button class="add" onclick="addC('${m.name}',${m.price})">+ أضف</button></div></div></div>`;
 });
 document.getElementById('menu-container').innerHTML=html;
 document.getElementById('pts').textContent=points;
 document.getElementById('pts2').textContent=points;
 document.getElementById('fill').style.width=Math.min(points/30*100,100)+'%';
}
function addC(n,p){let f=cart.find(i=>i.n===n); if(f) f.q++; else cart.push({n,p,q:1}); upd();}
function upd(){let c=cart.reduce((s,i)=>s+i.q,0); let fc=document.getElementById('fcount'); if(c>0){fc.style.display='grid'; fc.textContent=c} else fc.style.display='none'; let t=0,h=''; if(!cart.length){document.getElementById('clist').innerHTML='اختار حاجة بنينة'; document.getElementById('ctotal').textContent='0 دت'; return} cart.forEach(i=>{h+=`<div class="row"><span>• ${i.n} x${i.q}</span><span>${(i.p*i.q).toFixed(1)} دت <button onclick="chg('${i.n}',-1)" style="background:#fff;border:1px solid #BBDEFB;width:28px;height:28px;border-radius:8px">−</button> <button onclick="chg('${i.n}',1)" style="background:#0D47A1;color:#fff;border:none;width:28px;height:28px;border-radius:8px">+</button></span></div>`; t+=i.p*i.q}); document.getElementById('clist').innerHTML=h; document.getElementById('ctotal').textContent=t.toFixed(1)+' دت'; document.getElementById('pts2').textContent=points + Math.floor(t);}
function chg(n,d){let f=cart.find(i=>i.n===n); if(!f) return; f.q+=d; if(f.q<=0) cart=cart.filter(i=>i.n!==n); upd()}
function clearC(){cart=[]; upd();}
function filt(cat,el){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); el.classList.add('active'); document.querySelectorAll('.card').forEach(x=>{x.style.display=(cat==='all'||x.dataset.cat===cat)?'flex':'none'})}
function openCart(){document.getElementById('drawer').classList.add('open'); document.getElementById('ov').style.display='block'}
function closeCart(){document.getElementById('drawer').classList.remove('open'); setTimeout(()=>document.getElementById('ov').style.display='none',300)}
function getG(){if(!navigator.geolocation){alert('GPS لا يعمل');return} document.getElementById('gok').textContent='⏳...'; navigator.geolocation.getCurrentPosition(p=>{gps=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`; document.getElementById('gok').innerHTML=`✅ <a href="${gps}" target="_blank">شوف موقعك</a>`},()=>{document.getElementById('gok').textContent='❌ فشل'})}
function sendW(){if(!cart.length){alert('اختار من المنيو!');return} let name=document.getElementById('cname').value.trim(); if(!name){alert('اكتب اسمك');return} let total=cart.reduce((s,i)=>s+i.p*i.q,0); let earned=Math.floor(total); points+=earned; orders++; localStorage.setItem('delivery_real_points',points); localStorage.setItem('delivery_real_orders',orders); let msg=`🔵 DELIVERY RESTO - #DR-${String(orders).padStart(3,'0')}\n👤 ${name}\n🎁 نقاطك: ${points} (+${earned})\n\n`; cart.forEach(i=>{msg+=`• ${i.n} x${i.q} - ${i.p*i.q} دت\n`}); msg+=`\n💰 ${total} دت\n`; if(document.getElementById('caddr').value) msg+=`📍 ${document.getElementById('caddr').value}\n`; if(gps) msg+=`📍 GPS: ${gps}\n`; if(document.getElementById('cphone').value) msg+=`📱 ${document.getElementById('cphone').value}\n`; let wa=`https://wa.me/21656711448?text=${encodeURIComponent(msg)}`; document.getElementById('wa-link').href=wa; document.getElementById('wa-success').style.display='block'; let a=document.createElement('a'); a.href=wa; a.target='_blank'; document.body.appendChild(a); a.click(); setTimeout(()=>document.body.removeChild(a),800); render();}
let clicks=0,timer=null;
function logoClick(){clicks++; clearTimeout(timer); timer=setTimeout(()=>clicks=0,3000); if(clicks>=5){clicks=0; let p=prompt('كلمة السر:'); if(p==='Hidri@2020@') alert('🔓 أدمن - تقدر تعدل الأسعار من الكود');}}
render();
setInterval(()=>{let m=18+Math.floor(Math.random()*8); document.getElementById('live').textContent=`يوصل في ${m} دقيقة`},15000);
</script>
